<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberGuard - Connexion</title>
  <link rel="stylesheet" href="/styles/main.css" />
  <style>
    .login-form {
      max-width: 400px;
      margin: 100px auto;
      padding: var(--space-lg);
      background: var(--color-surface);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      text-align: center;
    }

    .login-form h1 {
      font-size: 1.5rem;
      margin-bottom: var(--space-md);
    }

    .form-group {
      margin-bottom: var(--space-md);
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: var(--space-xs);
      color: var(--color-text);
    }

    .form-input {
      width: 100%;
      padding: var(--space-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-bg);
      color: var(--color-text);
      font-size: 1rem;
      min-height: 44px;
    }

    .form-input:focus {
      outline: 2px solid var(--color-primary);
      border-color: transparent;
    }

    .form-submit {
      width: 100%;
      min-height: 52px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .form-submit:hover {
      background: var(--color-primary);
    }

    .error-message {
      color: var(--color-accent-red);
      font-size: 0.9rem;
      margin-top: var(--space-sm);
      display: none;
    }

    .error-message.visible {
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-form">
    <h1>Connexion Admin</h1>
    <p style="color: var(--color-text-muted); margin-bottom: var(--space-lg);">
      Accédez à l'espace de gestion de CyberGuard.
    </p>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" name="email" class="form-input" required />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mot de passe</label>
        <input type="password" id="password" name="password" class="form-input" required />
      </div>

      <button type="submit" class="form-submit">Se connecter</button>
      <!-- <p class="error-message" id="error-msg">Email ou mot de passe incorrect.</p> -->      
      <!-- Message d'erreur + Image humoristique -->
      <div class="error-container" id="error-container" style="display: none; text-align: center; margin-top: var(--space-md);">
        <p class="error-message" id="error-msg" style="margin-bottom: var(--space-sm);">Email ou mot de passe incorrect.</p>
        <img src="https://images.unsplash.com/photo-1543852786-1cf6624b9987?auto=format&fit=crop&w=300&q=80" 
             alt="Chat triste" 
             class="error-image" 
             style="max-width: 200px; border-radius: var(--radius-md); margin: 0 auto;" />
        <p style="font-size: 0.85rem; color: var(--color-text-muted); margin-top: var(--space-xs);">
          Oups ! Même les chats savent se connecter...
        </p>
      </div>
    </form>

    <p style="margin-top: var(--space-lg); font-size: 0.85rem; color: var(--color-text-muted);">
      <a href="/" style="color: var(--color-primary);">Retour au site public</a>
    </p>
  </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // On utilise directement la variable globale 'supabase' créée par le script CDN
    // Pas besoin de 'const supabase = ...' ni de 'window.supabase.createClient' ici si le CDN l'a déjà fait.
    // Mais pour être sûr d'avoir le bon client, on peut faire ceci :
    
    const SUPABASE_URL = 'https://mptvypkvdacwtvsszonw.supabase.co'; // REMPLACE PAR TA VRAIE URL
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1wdHZ5cGt2ZGFjd3R2c3N6b253Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNjczOTQsImV4cCI6MjEwMzY0MzM5NH0.Y0qqTxL0dRPMMpytuLhpRzpPLUVgWPr_yz-uZrGwzjg'; // REMPLACE PAR TA VRAIE CLÉ
    
    // Création du client explicitement pour éviter les conflits
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      console.log('Tentative de connexion pour:', email);

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      // if (error) {
      //   console.error('Erreur de connexion:', error);
      //   errorMsg.textContent = 'Erreur : ' + error.message;
      //   errorMsg.classList.add('visible');
      // } 
            if (error) {
        console.error('Erreur de connexion:', error);
        errorMsg.textContent = 'Erreur : ' + error.message;
        
        // Affiche le conteneur complet (message + image)
        document.getElementById('error-container').style.display = 'block';
      }
      else {
        console.log('Connexion réussie ! Session:', data.session);
        // Petite attente pour être sûr que la session est écrite
        setTimeout(() => {
          window.location.href = '/admin.html';
        }, 500);
      }
    });
  </script>
</body>
</html>
