<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberGuard - Administration</title>
  <link rel="stylesheet" href="/styles/main.css" />
  <style>
    /* Styles spécifiques à l'admin */
    .admin-form {
      max-width: 480px;
      margin: 0 auto;
      padding: var(--space-md);
      padding-bottom: var(--space-xl);
    }

    .form-group {
      margin-bottom: var(--space-md);
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: var(--space-xs);
      color: var(--color-text);
    }

    .form-input,
    .form-textarea {
      width: 100%;
      padding: var(--space-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 1rem;
      min-height: 44px;
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-input:focus,
    .form-textarea:focus {
      outline: 2px solid var(--color-primary);
      border-color: transparent;
    }

    .form-row {
      display: flex;
      gap: var(--space-sm);
    }

    .form-submit {
      width: 100%;
      min-height: 52px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .form-submit:hover {
      background: var(--color-primary);
      transform: scale(1.02);
    }

    .form-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .autofill-btn {
      width: 100%;
      min-height: 44px;
      background: transparent;
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      color: var(--color-primary);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: var(--space-xs);
    }

    .autofill-btn:hover {
      background: rgba(0, 212, 255, 0.1);
    }

    .autofill-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .success-message {
      background: rgba(46, 204, 113, 0.15);
      color: var(--color-accent-green);
      padding: var(--space-md);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-lg);
      display: none;
      text-align: center;
    }

    .success-message.visible {
      display: block;
    }

    .preview-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-top: var(--space-sm);
      display: none;
    }

    .preview-image.visible {
      display: block;
    }

    .admin-list {
      margin-top: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .admin-item {
      background: var(--color-surface);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: flex-start;
      gap: var(--space-md);
    }

    .admin-item__image {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .admin-item__content {
      flex: 1;
    }

    .admin-item__title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: var(--space-xs);
    }

    .admin-item__meta {
      font-size: 0.8rem;
      color: var(--color-text-muted);
      margin-bottom: var(--space-sm);
    }

    .admin-item__actions {
      display: flex;
      gap: var(--space-sm);
    }

    .admin-item__btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .admin-item__btn--edit {
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
    }

    .admin-item__btn--delete {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid var(--color-accent-red);
      color: var(--color-accent-red);
    }
  </style>
</head>
<body>

  <header class="header" role="banner">
    <div class="header__inner">
      <a href="/" class="logo" aria-label="CyberGuard - Accueil">
        <span class="logo__icon" aria-hidden="true">🛡️</span>
        CyberGuard Admin
      </a>
      <a href="/" class="footer__link" style="min-height: auto;">Retour site</a>
    </div>
  </header>

  <main class="admin-form">
    <h1 class="hero__title" style="margin: var(--space-lg) 0;">Ajouter un contenu</h1>

    <div class="success-message" id="success-msg">
      ✅ Contenu publié avec succès !
    </div>

    <form id="content-form">
      <div class="form-group">
        <label class="form-label" for="url">URL du site *</label>
        <input
          type="url"
          id="url"
          name="url"
          class="form-input"
          placeholder="https://example.com"
          required
        />
        <button type="button" id="autofill-btn" class="autofill-btn">
          ⚡ Auto-remplir depuis l'URL
        </button>
      </div>

      <div class="form-group">
        <label class="form-label" for="title">Titre *</label>
        <input
          type="text"
          id="title"
          name="title"
          class="form-input"
          placeholder="Titre accrocheur..."
          required
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description (accroche) *</label>
        <textarea
          id="description"
          name="description"
          class="form-textarea"
          placeholder="Texte percutant en 1-2 phrases..."
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="image_url">URL de l'image (optionnel)</label>
        <input
          type="url"
          id="image_url"
          name="image_url"
          class="form-input"
          placeholder="Laisser vide pour auto-extraction"
        />
        <img
          src=""
          alt="Aperçu"
          id="image-preview"
          class="preview-image"
        />
        <small style="color: var(--color-text-muted); font-size: 0.8rem; display: block; margin-top: var(--space-xs);">
          💡 Laissez vide pour utiliser l'image extraite automatiquement
        </small>
      </div>

      <div class="form-group">
        <label class="form-label" for="category">Catégorie</label>
        <select id="category" name="category" class="form-input">
          <option value="">— Aucune catégorie —</option>
          <option value="sms">📱 SMS frauduleux</option>
          <option value="email">📧 Email suspect</option>
          <option value="password">🔓 Mot de passe volé</option>
          <option value="wifi">📶 Wi-Fi public</option>
          <option value="payment">💳 Paiement bloqué</option>
          <option value="app">📲 App malveillante</option>
          <option value="account">🤕 Compte piraté</option>
          <option value="general">🛡️ Sécurité générale</option>
        </select>
        <small style="color: var(--color-text-muted); font-size: 0.8rem; display: block; margin-top: var(--space-xs);">
          Choisissez une catégorie existante. Plus tard, vous pourrez en créer de nouvelles.
        </small>
      </div>

      <button type="submit" class="form-submit">Publier</button>
    </form>

    <hr style="border: none; border-top: 1px solid var(--color-border); margin: var(--space-xl) 0;" />

    <h2 style="font-size: 1.2rem; margin-bottom: var(--space-md);">Contenus existants</h2>
    <div id="admin-list" class="admin-list">
      <p style="color: var(--color-text-muted); text-align: center; padding: var(--space-lg);">Chargement...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
  const { addContent, deleteContent, fetchAllContent } = await import('/scripts/supabase-client.js');

  const form = document.getElementById('content-form');
  const successMsg = document.getElementById('success-msg');
  const adminList = document.getElementById('admin-list');
  const autofillBtn = document.getElementById('autofill-btn');
  const urlInput = document.getElementById('url');
  const titleInput = document.getElementById('title');
  const descInput = document.getElementById('description');
  const imageInput = document.getElementById('image_url');
  const imagePreview = document.getElementById('image-preview');

  // ========================================
  // AUTO-REMPLISSAGE VIA MICROLINK API
  // ========================================
  autofillBtn.addEventListener('click', async () => {
    const url = urlInput.value.trim();

    if (!url) {
      alert('Collez une URL d\'abord.');
      return;
    }

    try { new URL(url); } catch {
      alert('URL invalide. Ex: https://haveibeenpwned.com/');
      return;
    }

    autofillBtn.disabled = true;
    autofillBtn.textContent = '⏳ Extraction...';

    try {
      const res = await fetch('https://api.microlink.io/?url=' + encodeURIComponent(url));
      const data = await res.json();

      console.log('Microlink:', data);

      if (data.status !== 'success') {
        throw new Error(data.message || 'Extraction échouée');
      }

      const meta = data.data;
      if (meta.title) titleInput.value = meta.title;
      if (meta.description) descInput.value = meta.description.substring(0, 180);

      const img = (meta.image && meta.image.url) || (meta.logo && meta.logo.url);
      if (img) {
        imageInput.value = img;
        imagePreview.src = img;
        imagePreview.classList.add('visible');
      }

      successMsg.textContent = '✅ Métadonnées extraites !';
      successMsg.classList.add('visible');
      setTimeout(() => successMsg.classList.remove('visible'), 3000);

    } catch (err) {
      console.error('Erreur extraction:', err);
      alert('Extraction impossible. Remplissez manuellement.');
    } finally {
      autofillBtn.disabled = false;
      autofillBtn.textContent = '⚡ Auto-remplir depuis l\'URL';
    }
  });

  // ========================================
  // PREVIEW IMAGE
  // ========================================
  imageInput.addEventListener('input', () => {
    if (imageInput.value.trim()) {
      imagePreview.src = imageInput.value;
      imagePreview.classList.add('visible');
    } else {
      imagePreview.classList.remove('visible');
    }
  });

  // ========================================
  // PUBLICATION
  // ========================================
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const fd = new FormData(form);
    const content = {
      title: fd.get('title').trim(),
      description: fd.get('description').trim(),
      image_url: fd.get('image_url').trim() || null,
      target_url: fd.get('url').trim(),
      category: fd.get('category') || null,
      published: true
    };

    const btn = form.querySelector('.form-submit');
    btn.disabled = true;
    btn.textContent = 'Publication...';

    try {
      const { error } = await addContent(content);
      if (error) throw error;

      successMsg.textContent = '✅ Contenu publié !';
      successMsg.classList.add('visible');
      form.reset();
      imagePreview.classList.remove('visible');
      setTimeout(() => successMsg.classList.remove('visible'), 3000);

      loadAdminList();
    } catch (err) {
      alert('Erreur : ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Publier';
    }
  });

  // ========================================
  // LISTE ADMIN
  // ========================================
  async function loadAdminList() {
    try {
      const { data, error } = await fetchAllContent();

      if (error) {
        adminList.innerHTML = '<p style="color:var(--color-accent-red);text-align:center;padding:var(--space-lg);">Erreur: ' + error.message + '</p>';
        return;
      }

      if (!data || data.length === 0) {
        adminList.innerHTML = '<p style="color:var(--color-text-muted);text-align:center;padding:var(--space-lg);">Aucun contenu.</p>';
        return;
      }

      adminList.innerHTML = '';

      data.forEach(item => {
        const div = document.createElement('div');
        div.className = 'admin-item';
        div.innerHTML = `
          ${item.image_url ? '<img src="' + escapeHtml(item.image_url) + '" alt="" class="admin-item__image" />' : ''}
          <div class="admin-item__content">
            <div class="admin-item__title">${escapeHtml(item.title)}</div>
            <div class="admin-item__meta">${new Date(item.created_at).toLocaleDateString('fr-FR')}</div>
            <div class="admin-item__actions">
              <a href="${escapeHtml(item.target_url)}" target="_blank" rel="noopener noreferrer" class="admin-item__btn admin-item__btn--edit">Ouvrir</a>
              <button onclick="handleDelete(${item.id})" class="admin-item__btn admin-item__btn--delete">Supprimer</button>
            </div>
          </div>
        `;
        adminList.appendChild(div);
      });
    } catch (err) {
      console.error('Erreur liste:', err);
      adminList.innerHTML = '<p style="color:var(--color-accent-red);text-align:center;padding:var(--space-lg);">Erreur de chargement.</p>';
    }
  }

  window.handleDelete = async (id) => {
    if (!confirm('Supprimer ce contenu ?')) return;
    const { error } = await deleteContent(id);
    if (error) { alert('Erreur: ' + error.message); return; }
    loadAdminList();
  };

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  loadAdminList();
</script>
</body>
</html>
