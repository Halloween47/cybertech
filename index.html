<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberGuard - Administration</title>
  <link rel="stylesheet" href="/styles/main.css" />
  <style>
    .admin-form {
      max-width: 480px;
      margin: 0 auto;
      padding: var(--space-md);
      padding-bottom: var(--space-xl);
    }

    .form-group { margin-bottom: var(--space-md); }

    .form-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: var(--space-xs);
      color: var(--color-text);
    }

    .form-input, .form-textarea {
      width: 100%;
      padding: var(--space-sm);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      background: var(--color-surface);
      color: var(--color-text);
      font-size: 1rem;
      min-height: 44px;
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-input:focus, .form-textarea:focus {
      outline: 2px solid var(--color-primary);
      border-color: transparent;
    }

    .form-submit {
      width: 100%;
      min-height: 52px;
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .form-submit:hover { background: var(--color-primary); transform: scale(1.02); }
    .form-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    .autofill-btn {
      width: 100%;
      min-height: 44px;
      background: transparent;
      border: 1px solid var(--color-primary);
      border-radius: var(--radius-sm);
      color: var(--color-primary);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      margin-top: var(--space-xs);
    }

    .autofill-btn:hover { background: rgba(0, 212, 255, 0.1); }
    .autofill-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .success-message {
      background: rgba(46, 204, 113, 0.15);
      color: var(--color-accent-green);
      padding: var(--space-md);
      border-radius: var(--radius-sm);
      margin-bottom: var(--space-lg);
      display: none;
      text-align: center;
    }

    .success-message.visible { display: block; }

    .preview-image {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      margin-top: var(--space-sm);
      display: none;
    }

    .preview-image.visible { display: block; }

    .admin-list {
      margin-top: var(--space-xl);
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .admin-item {
      background: var(--color-surface);
      padding: var(--space-md);
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border);
      display: flex;
      align-items: flex-start;
      gap: var(--space-md);
    }

    .admin-item__image {
      width: 80px;
      height: 60px;
      object-fit: cover;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    .admin-item__content { flex: 1; }
    .admin-item__title { font-size: 1rem; font-weight: 600; margin-bottom: var(--space-xs); }
    .admin-item__meta { font-size: 0.8rem; color: var(--color-text-muted); margin-bottom: var(--space-sm); }
    .admin-item__actions { display: flex; gap: var(--space-sm); }

    .admin-item__btn {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
    }

    .admin-item__btn--edit {
      background: rgba(0, 212, 255, 0.15);
      border: 1px solid var(--color-primary);
      color: var(--color-primary);
    }

    .admin-item__btn--delete {
      background: rgba(231, 76, 60, 0.15);
      border: 1px solid var(--color-accent-red);
      color: var(--color-accent-red);
    }
  </style>
</head>
<body>

  <header class="header" role="banner">
    <div class="header__inner">
      <a href="/" class="logo" aria-label="CyberGuard - Accueil">
        <span class="logo__icon" aria-hidden="true">🛡️</span>
        CyberGuard Admin
      </a>
      <a href="/" class="footer__link" style="min-height: auto;">← Retour site</a>
    </div>
  </header>

  <main class="admin-form">
    <h1 class="hero__title" style="margin: var(--space-lg) 0;">Ajouter un contenu</h1>

    <div class="success-message" id="success-msg">✅ Contenu publié avec succès !</div>

    <form id="content-form">
      <div class="form-group">
        <label class="form-label" for="url">URL du site *</label>
        <input type="url" id="url" name="url" class="form-input" placeholder="https://example.com" required />
        <button type="button" id="autofill-btn" class="autofill-btn">⚡ Auto-remplir depuis l'URL</button>
      </div>

      <div class="form-group">
        <label class="form-label" for="title">Titre *</label>
        <input type="text" id="title" name="title" class="form-input" placeholder="Titre accrocheur..." required />
      </div>

      <div class="form-group">
        <label class="form-label" for="description">Description (accroche) *</label>
        <textarea id="description" name="description" class="form-textarea" placeholder="Texte percutant en 1-2 phrases..." required></textarea>
      </div>

      <div class="form-group">
        <label class="form-label" for="image_url">URL de l'image</label>
        <input type="url" id="image_url" name="image_url" class="form-input" placeholder="Laisser vide pour auto-extraction" />
        <img src="" alt="Aperçu" id="image-preview" class="preview-image" />
        <small style="color: var(--color-text-muted); font-size: 0.8rem; display: block; margin-top: var(--space-xs);">
          💡 Laissez vide pour utiliser l'image extraite automatiquement
        </small>
      </div>

      <button type="submit" class="form-submit">Publier</button>
    </form>

    <hr style="border: none; border-top: 1px solid var(--color-border); margin: var(--space-xl) 0;" />

    <h2 style="font-size: 1.2rem; margin-bottom: var(--space-md);">Contenus existants</h2>
    <div id="admin-list" class="admin-list">
      <p style="color: var(--color-text-muted); text-align: center; padding: var(--space-lg);">Chargement...</p>
    </div>
  </main>

  <script type="module">
    import { fetchPublishedContent, addContent, deleteContent } from '/scripts/supabase-client.js';

    const form = document.getElementById('content-form');
    const successMsg = document.getElementById('success-msg');
    const adminList = document.getElementById('admin-list');
    const autofillBtn = document.getElementById('autofill-btn');
    const urlInput = document.getElementById('url');
    const titleInput = document.getElementById('title');
    const descInput = document.getElementById('description');
    const imageInput = document.getElementById('image_url');
    const imagePreview = document.getElementById('image-preview');

    // ========================================
    // AUTO-REMPLISSAGE VIA MICROLINK API
    // ========================================
    autofillBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();

      if (!url) {
        alert('Veuillez coller une URL d\'abord.');
        return;
      }

      try {
        new URL(url);
      } catch {
        alert('URL invalide. Vérifiez le format (https://...)');
        return;
      }

      autofillBtn.disabled = true;
      autofillBtn.textContent = '⏳ Extraction en cours...';

      try {
        const response = await fetch(`https://api.microlink.io/?url=${encodeURIComponent(url)}`);
        const data = await response.json();

        console.log('Microlink response:', data);

        if (data.status !== 'success') {
          throw new Error('Extraction échouée');
        }

        const meta = data.data;

        // Remplir les champs
        if (meta.title) titleInput.value = meta.title;
        if (meta.description) descInput.value = meta.description.substring(0, 180);

        if (meta.image && meta.image.url) {
          imageInput.value = meta.image.url;
          imagePreview.src = meta.image.url;
          imagePreview.classList.add('visible');
        } else if (meta.logo && meta.logo.url) {
          imageInput.value = meta.logo.url;
          imagePreview.src = meta.logo.url;
          imagePreview.classList.add('visible');
        }

        successMsg.textContent = '✅ Métadonnées extraites ! Vous pouvez ajuster puis publier.';
        successMsg.classList.add('visible');
        setTimeout(() => successMsg.classList.remove('visible'), 4000);

      } catch (error) {
        console.error('Erreur extraction:', error);
        alert('Impossible d\'extraire automatiquement. Remplissez les champs manuellement.');
      } finally {
        autofillBtn.disabled = false;
        autofillBtn.textContent = '⚡ Auto-remplir depuis l\'URL';
      }
    });

    // ========================================
    // PREVIEW IMAGE
    // ========================================
    imageInput.addEventListener('input', () => {
      if (imageInput.value.trim()) {
        imagePreview.src = imageInput.value;
        imagePreview.classList.add('visible');
      } else {
        imagePreview.classList.remove('visible');
      }
    });

    // ========================================
    // SOUMISSION FORMULAIRE
    // ========================================
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const content = {
        title: formData.get('title').trim(),
        description: formData.get('description').trim(),
        image_url: formData.get('image_url').trim() || null,
        target_url: formData.get('url').trim(),
        published: true
      };

      const submitBtn = form.querySelector('.form-submit');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Publication...';

      try {
        const result = await addContent(content);

        if (!result) {
          throw new Error('Échec de l\'ajout');
        }

        successMsg.textContent = '✅ Contenu publié avec succès !';
        successMsg.classList.add('visible');
        form.reset();
        imagePreview.classList.remove('visible');

        setTimeout(() => successMsg.classList.remove('visible'), 3000);

        loadAdminList();
      } catch (err) {
        alert('Erreur : ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Publier';
      }
    });

    // ========================================
    // LISTE ADMIN
    // ========================================
    async function loadAdminList() {
      const { supabase } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
      const client = supabase.createClient(
        (await import('/scripts/supabase-client.js')).SUPABASE_URL || '',
        ''
      );

      // Utilisation directe du module
      const module = await import('/scripts/supabase-client.js');
      const contents = await module.fetchAllContent();

      if (!contents || contents.length === 0) {
        adminList.innerHTML = '<p style="color: var(--color-text-muted); text-align: center; padding: var(--space-lg);">Aucun contenu pour l\'instant.</p>';
        return;
      }

      adminList.innerHTML = '';

      contents.forEach(item => {
        const div = document.createElement('div');
        div.className = 'admin-item';

        div.innerHTML = `
          ${item.image_url ? `<img src="${escapeHtml(item.image_url)}" alt="" class="admin-item__image" />` : ''}
          <div class="admin-item__content">
            <div class="admin-item__title">${escapeHtml(item.title)}</div>
            <div class="admin-item__meta">
              ${new Date(item.created_at).toLocaleDateString('fr-FR')}
            </div>
            <div class="admin-item__actions">
              <a href="${escapeHtml(item.target_url)}" target="_blank" rel="noopener noreferrer" class="admin-item__btn admin-item__btn--edit">🔗 Ouvrir</a>
              <button onclick="handleDelete(${item.id})" class="admin-item__btn admin-item__btn--delete">🗑️ Supprimer</button>
            </div>
          </div>
        `;

        adminList.appendChild(div);
      });
    }

    // ========================================
    // SUPPRESSION
    // ========================================
    window.handleDelete = async (id) => {
      if (!confirm('Supprimer définitivement ce contenu ?')) return;

      const success = await deleteContent(id);

      if (success) {
        loadAdminList();
      } else {
        alert('Erreur lors de la suppression.');
      }
    };

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Charger au démarrage
    loadAdminList();
  </script>
</body>
</html>
